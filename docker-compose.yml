# Planar + Caddy (automatic HTTPS). Usage:
#   DOMAIN=planar.example.com docker compose up -d --build
#   Optional: LEGACY_OWNER=<username> hands documents saved before accounts existed to that account.
services:
  planar:
    build: .
    restart: unless-stopped
    environment:
      LEGACY_OWNER: ${LEGACY_OWNER:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - planar-data:/data

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - planar
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  planar-data:
  caddy-data:
  caddy-config:
